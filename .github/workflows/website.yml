name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - name: Verify public history excludes private records
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(PROJECT-INTERNAL|AGENTS.md|CLAUDE.md|\.template|\.env|.*\.p12|.*\.p8)(/|$)'; then
            echo 'Private material is tracked in the public repository.' >&2
            exit 1
          fi
